[project]
name = "kg-extraction"
version = "0.1.0"
description = "Extração de grafos de conhecimento a partir de casos clínicos do MultiCaRe (Projeto 1, NLP 2026)"
requires-python = ">=3.9"
dependencies = [
    "pandas>=2.0",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
